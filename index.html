<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="最後一張！">
<meta name="theme-color" content="#0B1D24">
<title>最後一張！</title>
<style>
:root{
  --ink:#0B1D24; --table:#14323D; --table2:#1E4A58; --cream:#FFF8EA;
  --c0:#FF5A5F; --c1:#F5A300; --c2:#16C79A; --c3:#7B61FF;
  --hh:min(34vh,170px); --ph:min(29vh,140px); --mh:min(10vh,44px);
  --cur:var(--c0);
  font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@supports (height:1dvh){
  :root{ --hh:min(34dvh,170px); --ph:min(29dvh,140px); --mh:min(10dvh,44px); }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 46%,var(--table2),var(--table) 58%,var(--ink) 125%)}
.screen{position:absolute;inset:0;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

/* ---------- 牌 ---------- */
.card{position:relative;flex:none;height:var(--h);width:calc(var(--h)*.68);
  border-radius:calc(var(--h)*.11);border:calc(var(--h)*.04) solid var(--cream);
  background:var(--col,#1B2A33);color:#fff;font-weight:900;line-height:1;overflow:hidden;
  box-shadow:0 calc(var(--h)*.02) calc(var(--h)*.07) rgba(0,0,0,.4)}
.c0{--col:var(--c0)} .c1{--col:var(--c1)} .c2{--col:var(--c2)} .c3{--col:var(--c3)}
.card .bg{position:absolute;inset:0;display:grid;place-items:center;opacity:.2}
.card .bg svg{width:94%;height:auto;fill:#fff}
.card .big{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--h)*.44);
  text-shadow:0 calc(var(--h)*.025) 0 rgba(0,0,0,.25)}
.card .big svg{width:calc(var(--h)*.4);height:calc(var(--h)*.4);
  filter:drop-shadow(0 calc(var(--h)*.02) 0 rgba(0,0,0,.25))}
.card .big.txt{font-size:calc(var(--h)*.36)}
.card .cor{position:absolute;top:5%;left:9%;font-size:calc(var(--h)*.15)}
.card .cor.b{top:auto;left:auto;bottom:5%;right:9%;transform:rotate(180deg)}
.card .cor svg{width:1em;height:1em;display:block}
.card .u{text-decoration:underline;text-underline-offset:.1em;text-decoration-thickness:.08em}
.card.wild .big svg{width:calc(var(--h)*.52);height:calc(var(--h)*.52)}
.card .plus{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--h)*.3);color:var(--cream);
  text-shadow:.05em 0 0 #1B2A33,-.05em 0 0 #1B2A33,0 .05em 0 #1B2A33,0 -.05em 0 #1B2A33,
    .04em .04em 0 #1B2A33,-.04em .04em 0 #1B2A33,.04em -.04em 0 #1B2A33,-.04em -.04em 0 #1B2A33}
.card.pick0{border-color:var(--c0)} .card.pick1{border-color:var(--c1)}
.card.pick2{border-color:var(--c2)} .card.pick3{border-color:var(--c3)}
.card.back{background:#0F2730}
.card.back::after{content:"";position:absolute;left:19%;width:62%;top:50%;aspect-ratio:1;border-radius:50%;
  transform:translateY(-50%) rotate(45deg);
  background:conic-gradient(var(--c0) 0 25%,var(--c1) 0 50%,var(--c2) 0 75%,var(--c3) 0)}
.card.back::before{content:"";position:absolute;z-index:1;left:39%;width:22%;top:50%;aspect-ratio:1;border-radius:50%;
  transform:translateY(-50%);background:#0F2730}

/* ---------- 主選單 ---------- */
#menu{display:grid;grid-template-columns:1.1fr 1fr;align-items:center}
.menu-l{padding:0 2vw 0 8vw}
.title{margin:0;font-size:clamp(38px,15vh,92px);font-weight:900;letter-spacing:.02em;line-height:1.05;
  text-shadow:0 .06em 0 rgba(0,0,0,.3);white-space:nowrap}
.title span:nth-child(1){color:var(--c0)} .title span:nth-child(2){color:var(--c1)}
.title span:nth-child(3){color:var(--c2)} .title span:nth-child(4){color:var(--c3)}
.lead{margin:1.6vh 0 3.4vh;font-size:clamp(13px,3.6vh,17px);line-height:1.6;opacity:.85;max-width:24em}
.picker-row{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,4.2vh,19px)}
.picker-row .lbl{margin-right:6px;opacity:.85;font-weight:700}
.pval{min-width:3em;text-align:center}
.arrow{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,248,234,.35);background:rgba(11,29,36,.5);
  display:grid;place-items:center;padding:0}
.arrow svg{width:16px;height:16px;fill:var(--cream)}
.arrow:active{background:rgba(255,248,234,.2)}
.btn{border:0;border-radius:14px;padding:11px 22px;font-weight:900;font-size:clamp(15px,4.2vh,18px);
  background:var(--cream);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.4);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.primary{background:var(--c1);padding:13px 34px;font-size:clamp(17px,5vh,22px)}
.btn.ghost{background:rgba(255,248,234,.12);color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.menu-r{position:relative;height:100%;--h:min(52vh,250px)}
.menu-r .card{position:absolute;left:50%;top:50%;margin-left:calc(var(--h)*-.34);margin-top:calc(var(--h)*-.5);
  transform-origin:50% 115%}

/* ---------- 牌桌 ---------- */
#table{display:grid;grid-template-rows:auto 1fr auto}
#topRow{position:relative;display:flex;justify-content:center;align-items:flex-start;
  min-height:calc(var(--mh) + 14px);padding:1.6vh 80px 0 80px}
#deckInfo{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:7px;--h:28px;
  background:rgba(11,29,36,.6);border-radius:999px;padding:4px 12px 4px 8px;font-size:13px;font-weight:700;white-space:nowrap}
#deckInfo b{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
#deckInfo .card{box-shadow:none}
.slot{display:flex;justify-content:center;align-items:center}
#slotL{padding-left:1.2vw} #slotR{padding-right:1.2vw}
.seat.side{flex-direction:column;border-radius:18px;padding:6px 9px;gap:3px;text-align:center}
.seat.side .mini{justify-content:center}
.seat{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;position:relative;
  background:rgba(11,29,36,.45);border:2px solid transparent;transition:border-color .2s,background .2s,transform .2s}
.seat.active{border-color:var(--cream);background:rgba(11,29,36,.85);transform:scale(1.05)}
.ava{width:var(--mh);height:var(--mh);font-size:calc(var(--mh)*.62);display:grid;place-items:center;
  background:var(--cream);border-radius:50%;line-height:1}
.nm{font-weight:800;font-size:13px;white-space:nowrap;max-width:6em;overflow:hidden;text-overflow:ellipsis}
.seat.off .ava{filter:grayscale(1);opacity:.6}
.cnt{font-size:12px;opacity:.75;white-space:nowrap}
.mini{display:flex;height:var(--mh);min-width:calc(var(--mh)*.68);--h:var(--mh)}
.mini .card{margin-left:calc(var(--mh)*-.47)}
.mini .card:first-child{margin-left:0}

#center{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;min-height:0}
#status{justify-self:end;text-align:right;padding-right:2vw}
#who{font-weight:900;font-size:clamp(15px,4.6vh,21px)}
#hint{font-size:clamp(11px,3.2vh,14px);opacity:.8;margin-top:4px;line-height:1.4}
#piles{position:relative;display:flex;align-items:center;gap:calc(var(--ph)*.3);
  padding:calc(var(--ph)*.1) calc(var(--ph)*.34);--h:var(--ph)}
#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#ring ellipse{fill:none;stroke:var(--cur);stroke-width:3;stroke-dasharray:10 13;stroke-linecap:round;opacity:.85;
  vector-effect:non-scaling-stroke;animation:dash 1.6s linear infinite;transition:stroke .3s}
#ring .heads{fill:var(--cur);transition:fill .3s;transform-origin:130px 70px}
.ccw #ring ellipse{animation-direction:reverse}
.ccw #ring .heads{transform:scaleY(-1)}
@keyframes dash{to{stroke-dashoffset:-23}}
#deck{position:relative;padding:0;border:0;background:none;border-radius:calc(var(--ph)*.11)}
#deck .card{box-shadow:3px 3px 0 #0a1a20,6px 6px 0 rgba(0,0,0,.35)}
#deck.hintme{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-6%)}}
#pile{position:relative;height:var(--ph);width:calc(var(--ph)*.68)}
#pile .card{position:absolute;inset:0}
#actions{justify-self:start;padding-left:2vw;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#unoBtn{background:var(--c0);color:#fff;position:relative;overflow:hidden;font-size:clamp(17px,5.4vh,24px);
  padding:10px 20px;letter-spacing:.04em;opacity:.36;transition:opacity .15s}
#unoBtn.ready{opacity:1}
#unoBtn.urgent{animation:pulse .45s ease-in-out infinite alternate}
#unoBtn.urgent::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--cream);
  transform-origin:left;animation:shrink var(--win,2.6s) linear forwards}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes shrink{to{transform:scaleX(0)}}

#handWrap{padding:0 5vw;height:calc(var(--hh)*1.2 + 6px)}
#hand{position:relative;height:100%;--h:var(--hh)}
#hand .card{position:absolute;top:calc(var(--hh)*.14);transition:transform .16s,filter .16s,left .16s}
#hand .card.dim{filter:brightness(.5) saturate(.75)}
#hand .card.can{cursor:pointer;box-shadow:0 0 0 2px rgba(255,248,234,.9),0 calc(var(--h)*.05) calc(var(--h)*.1) rgba(0,0,0,.5)}
#hand .card.shake{animation:shake .3s}
@keyframes shake{25%{margin-left:-5px}75%{margin-left:5px}}

#topBtns{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);
  display:flex;gap:6px;z-index:5}
.ico{width:32px;height:32px;border-radius:50%;border:0;background:rgba(11,29,36,.6);display:grid;place-items:center;padding:0}
.ico svg{width:16px;height:16px;fill:none;stroke:var(--cream);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 浮層 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.bubble{position:fixed;transform:translate(-50%,0);background:var(--cream);color:var(--ink);font-weight:900;font-size:14px;
  padding:6px 12px;border-radius:14px;white-space:nowrap;animation:pop 1.5s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
/* 特殊牌演出 */
#banner{--bh:min(32vh,128px);position:fixed;left:0;right:0;top:var(--by,40%);height:var(--bh);margin-top:calc(var(--bh)/-2);
  z-index:54;pointer-events:none;visibility:hidden}
#banner .strip{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.14)),var(--bc,#1B2A33);
  border-top:4px solid var(--cream);border-bottom:4px solid var(--cream);transform:scaleY(0);box-shadow:0 0 40px rgba(0,0,0,.55)}
#banner.wildbn .strip{border-image:linear-gradient(90deg,var(--c0),var(--c1),var(--c2),var(--c3)) 1}
#banner .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:min(3vw,22px);color:#fff;opacity:0}
#banner .bico{width:calc(var(--bh)*.6);height:calc(var(--bh)*.6);flex:none;display:grid;place-items:center}
#banner .bico svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
#banner .bbig{font-weight:900;font-size:calc(var(--bh)*.42);line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap}
#banner .bbig.num{font-size:calc(var(--bh)*.58)}
#banner .bsub{font-weight:800;font-size:clamp(12px,calc(var(--bh)*.15),19px);margin-top:4px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.3)}
#banner.go{visibility:visible}
#banner.go .strip{animation:bnStrip var(--bd) cubic-bezier(.2,.9,.2,1) forwards}
#banner.go .txt{animation:bnTxt var(--bd) cubic-bezier(.2,.9,.2,1) forwards}
#banner.go .bico.cw svg{animation:spinCW var(--bd) cubic-bezier(.25,.7,.2,1)}
#banner.go .bico.ccw svg{animation:spinCCW var(--bd) cubic-bezier(.25,.7,.2,1)}
@keyframes bnStrip{0%{transform:scaleY(0)}14%{transform:scaleY(1)}86%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes bnTxt{0%{opacity:0;transform:translateX(-30vw)}16%{opacity:1;transform:translateX(1.5vw)}24%{transform:translateX(0)}
  82%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(30vw)}}
@keyframes bnFadeS{0%{opacity:0;transform:scaleY(1)}15%{opacity:1;transform:scaleY(1)}85%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
@keyframes bnFade{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes spinCW{to{transform:rotate(540deg)}}
@keyframes spinCCW{to{transform:rotate(-540deg)}}
.shot{--s:min(22vh,84px);position:fixed;width:var(--s);height:var(--s);border-radius:50%;background:var(--sc);border:4px solid var(--cream);
  color:#fff;display:grid;place-items:center;font-weight:900;font-size:calc(var(--s)*.46);box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:57}
.burst{--s:min(26vh,100px);position:fixed;width:var(--s);height:var(--s);border-radius:50%;border:6px solid var(--sc);
  animation:burst .5s ease-out forwards;z-index:56}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
.stamp{--s:min(24vh,92px);position:fixed;width:var(--s);height:var(--s);color:var(--c0);animation:stamp .95s forwards;z-index:57}
.stamp svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
@keyframes stamp{0%{transform:scale(2.6) rotate(-30deg);opacity:0}18%{transform:scale(.9) rotate(0);opacity:1}26%{transform:scale(1)}
  80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.tally{position:fixed;transform:translate(-50%,-50%);min-width:46px;padding:4px 10px;border-radius:999px;background:var(--cream);
  color:var(--ink);font-weight:900;font-size:20px;text-align:center;z-index:57;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tally.pop{animation:tally .18s}
@keyframes tally{0%{transform:translate(-50%,-50%) scale(1.6)}100%{transform:translate(-50%,-50%) scale(1)}}
.hit{animation:hit .4s}
@keyframes hit{20%{transform:translate(-5px,2px) rotate(-1.5deg)}40%{transform:translate(5px,-2px) rotate(1.5deg)}
  60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.skipped{filter:grayscale(.9) brightness(.62)}
#table.quake{animation:quake .45s}
@keyframes quake{15%{transform:translate(-7px,4px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-5px,-3px)}
  60%{transform:translate(5px,3px)}75%{transform:translate(-3px,1px)}}
#ripple{position:fixed;inset:0;z-index:40;pointer-events:none;background:var(--rc);opacity:0}
#ripple.go{animation:rip .85s ease-out}
@keyframes rip{0%{opacity:.8;clip-path:circle(0 at var(--rx) var(--ry))}60%{opacity:.55}
  100%{opacity:0;clip-path:circle(150vmax at var(--rx) var(--ry))}}
#orbit{position:fixed;inset:0;width:100%;height:100%;z-index:41;pointer-events:none;opacity:0}
#orbit ellipse{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:26 30}
#orbit.go{animation:orbFade 1s ease-out}
#orbit.go ellipse{animation:orbMove 1s linear}
@keyframes orbFade{0%{opacity:0}15%{opacity:.9}75%{opacity:.9}100%{opacity:0}}
@keyframes orbMove{to{stroke-dashoffset:var(--od)}}
#toast{position:fixed;left:50%;bottom:calc(var(--hh)*1.2 + 10px);transform:translateX(-50%);background:rgba(11,29,36,.92);
  border:1.5px solid rgba(255,248,234,.25);padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:56;white-space:nowrap}
#toast.show{opacity:1}
.modal{position:absolute;inset:0;z-index:60;background:rgba(6,16,21,.74);display:grid;place-items:center;padding:10px}
.sheet{background:var(--ink);border:2px solid rgba(255,248,234,.16);border-radius:22px;padding:16px 22px;
  max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 10px;font-size:clamp(18px,6vh,26px);font-weight:900;text-align:center}
.row-btns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.colors button{width:min(20vh,84px);height:min(20vh,84px);border-radius:20px;border:4px solid var(--cream);
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.4);padding:0}
.colors button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.colors svg{width:56%;height:56%;fill:#fff;opacity:.9}
.res{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px 14px;align-items:center;font-size:14px}
.res .hd{font-size:12px;opacity:.6}
.res .name{font-weight:900;white-space:nowrap}
.res .left{display:flex;flex-wrap:wrap;gap:2px;--h:30px;min-width:120px;max-width:44vw}
.res .num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .win{color:var(--c1)}
#rotate{position:fixed;inset:0;z-index:99;background:var(--ink);display:none;place-items:center;text-align:center;
  font-weight:900;font-size:20px;line-height:1.7;padding:24px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:grid}}
@media (max-width:700px){.nm{font-size:12px}.seat{gap:5px}#deckInfo{font-size:12px}}
@media (prefers-reduced-motion:reduce){#ring ellipse,#deck.hintme,#unoBtn.urgent,#ripple.go,#orbit.go,#table.quake,.hit{animation:none}
  #banner.go .strip{animation-name:bnFadeS}#banner.go .txt{animation-name:bnFade}#banner.go .bico svg{animation:none}}

/* ---------- 連線：加入畫面與大廳 ---------- */
.menu-acts{display:flex;flex-direction:column;align-items:flex-start;gap:2.8vh}
.picker-row .lbl{white-space:nowrap}
#menu{grid-template-columns:1.35fr 1fr}
#menu .picker-row{gap:8px}
.btn:disabled{opacity:.5;box-shadow:none;transform:none}
#clock{display:inline-block;margin-left:8px;min-width:2em;padding:1px 7px;border-radius:999px;background:var(--cream);
  color:var(--ink);font-size:.72em;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
#clock.low{background:var(--c0);color:#fff}
input{font:inherit;font-size:17px;font-weight:800;color:var(--ink);background:var(--cream);border:0;border-radius:12px;
  padding:9px 12px;min-width:0;-webkit-user-select:text;user-select:text}
input:focus{outline:3px solid var(--c1)}
.backbtn{position:absolute;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 10px);
  padding:7px 14px;font-size:14px;z-index:3}
#online{display:grid;place-items:center}
.ol-box{width:min(86vw,640px);text-align:center}
.ol-box h2{margin:0 0 2vh;font-size:clamp(20px,7vh,30px);font-weight:900}
.name-row{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;margin-bottom:3vh}
.name-row input{width:9em;text-align:center}
.ol-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ol-col{background:rgba(11,29,36,.55);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;gap:10px}
.ol-col p{margin:0;font-size:13px;line-height:1.5;opacity:.85}
.join-row{display:flex;gap:8px;justify-content:center}
.join-row input{width:5.2em;text-align:center;letter-spacing:.15em}
.msg{font-size:13px;line-height:1.5;opacity:.85;margin:1.6vh 0 0;min-height:1.5em}

<script>
/*ENGINE-START*/
// 規則引擎：不碰畫面，之後做連線版可以直接沿用
const Engine = (() => {
  function makeDeck(){
    const d=[]; let id=0;
    for(let c=0;c<4;c++){
      d.push({id:id++,c,v:'0'});
      for(let n=1;n<=9;n++) for(let k=0;k<2;k++) d.push({id:id++,c,v:String(n)});
      for(const v of ['skip','rev','d2']) for(let k=0;k<2;k++) d.push({id:id++,c,v});
    }
    for(let k=0;k<4;k++){ d.push({id:id++,c:-1,v:'wild'}); d.push({id:id++,c:-1,v:'w4'}); }
    return d;
  }
  function shuffle(a,rng){
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  const isNum = c => c.v.length===1;
  function newGame(n,rng){
    rng = rng||Math.random;
    const deck=shuffle(makeDeck(),rng);
    const players=Array.from({length:n},()=>({hand:[]}));
    for(let k=0;k<7;k++) for(const p of players) p.hand.push(deck.pop());
    let i=deck.length-1; while(!isNum(deck[i])) i--;      // 起始牌一定是數字牌
    const first=deck.splice(i,1)[0];
    return {players,deck,discard:[first],color:first.c,dir:1,turn:Math.floor(rng()*n),
            phase:'play',drawnId:null,winner:-1,rng};
  }
  const top = s => s.discard[s.discard.length-1];
  function canPlay(s,card){
    if(s.phase==='over') return false;
    if(s.phase==='drawn' && card.id!==s.drawnId) return false;
    return card.c===-1 || card.c===s.color || card.v===top(s).v;
  }
  const playable = (s,pi) => s.players[pi].hand.filter(c=>canPlay(s,c));
  function step(s,pi,k){ const n=s.players.length; return ((pi+s.dir*k)%n+n)%n; }
  function take(s,ev){
    if(!s.deck.length){
      if(s.discard.length<=1) return null;
      const keep=s.discard.pop();
      s.deck=shuffle(s.discard,s.rng); s.discard=[keep];
      ev.push({t:'reshuffle',deck:s.deck.length});
    }
    return s.deck.pop();
  }
  function give(s,pi,k,ev){
    const cards=[];
    for(let i=0;i<k;i++){ const c=take(s,ev); if(!c) break; s.players[pi].hand.push(c); cards.push(c); }
    if(cards.length) ev.push({t:'draw',pi,cards,penalty:true});
  }
  function play(s,pi,cardId,color){
    const hand=s.players[pi].hand, idx=hand.findIndex(c=>c.id===cardId);
    if(s.turn!==pi || idx<0 || !canPlay(s,hand[idx])) throw new Error('illegal play');
    const card=hand[idx];
    if(card.c===-1 && !(color>=0 && color<4)) throw new Error('need color');
    const ev=[];
    hand.splice(idx,1); s.discard.push(card);
    s.color = card.c===-1 ? color : card.c;
    s.phase='play'; s.drawnId=null;
    ev.push({t:'play',pi,card,color:s.color});
    if(!hand.length){ s.phase='over'; s.winner=pi; ev.push({t:'win',pi}); return ev; }
    const n=s.players.length;
    if(card.v==='rev'){
      s.dir=-s.dir; ev.push({t:'rev',dir:s.dir});
      if(n===2){ ev.push({t:'skip',pi:step(s,pi,1)}); s.turn=pi; }   // 兩人時迴轉等於跳過
      else s.turn=step(s,pi,1);
    } else if(card.v==='skip'){
      ev.push({t:'skip',pi:step(s,pi,1)}); s.turn=step(s,pi,2);
    } else if(card.v==='d2' || card.v==='w4'){
      const target=step(s,pi,1);
      give(s,target,card.v==='d2'?2:4,ev);
      ev.push({t:'skip',pi:target}); s.turn=step(s,pi,2);
    } else s.turn=step(s,pi,1);
    ev.push({t:'turn',pi:s.turn});
    return ev;
  }
  function draw(s,pi){
    if(s.turn!==pi || s.phase!=='play') throw new Error('illegal draw');
    const ev=[], c=take(s,ev);
    if(c){
      s.players[pi].hand.push(c);
      ev.push({t:'draw',pi,cards:[c]});
      if(canPlay(s,c)){ s.phase='drawn'; s.drawnId=c.id; return ev; }
    }
    s.turn=step(s,pi,1); ev.push({t:'turn',pi:s.turn});
    return ev;
  }
  function pass(s,pi){
    if(s.turn!==pi || s.phase!=='drawn') throw new Error('illegal pass');
    s.phase='play'; s.drawnId=null; s.turn=step(s,pi,1);
    return [{t:'turn',pi:s.turn}];
  }
  function penalty(s,pi,k){ const ev=[]; give(s,pi,k,ev); return ev; }
  const points = c => isNum(c) ? +c.v : (c.c===-1 ? 50 : 20);
  return {makeDeck,newGame,top,canPlay,playable,step,play,draw,pass,penalty,points};
})();

// 電腦玩家
const Bot = {
  choose(s,pi){
    const hand=s.players[pi].hand, opts=Engine.playable(s,pi);
    if(!opts.length) return {type: s.phase==='drawn' ? 'pass' : 'draw'};
    const nextN=s.players[Engine.step(s,pi,1)].hand.length, danger=nextN<=2;
    const cnt=[0,0,0,0]; hand.forEach(c=>{ if(c.c>=0) cnt[c.c]++; });
    let best=null, bs=-Infinity;
    for(const c of opts){
      let sc;
      if(c.v==='w4') sc = danger ? 40 : -8;
      else if(c.v==='wild') sc = -5;
      else if(c.v==='d2') sc = 12 + (danger?30:0);
      else if(c.v==='skip') sc = 11 + (danger?25:0);
      else if(c.v==='rev') sc = 10 + (danger?20:0);
      else sc = +c.v;
      if(c.c>=0) sc += cnt[c.c]*0.6;
      sc += Math.random()*0.5;
      if(sc>bs){ bs=sc; best=c; }
    }
    let color;
    if(best.c===-1){
      const mx=Math.max(...cnt);
      const cands=[0,1,2,3].filter(i=>cnt[i]===mx);
      color=cands[Math.floor(Math.random()*cands.length)];
    }
    return {type:'play',id:best.id,color};
  }
};
/*ENGINE-END*/

// ---------- 畫面 ----------
const $ = q => document.querySelector(q);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEX = ['#FF5A5F','#F5A300','#16C79A','#7B61FF'];
const CNAME = ['紅色','黃色','綠色','紫色'];
const SHAPE = [
  '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>',
  '<svg viewBox="0 0 100 100"><path d="M50 12 91 84H9z" stroke-linejoin="round"/></svg>',
  '<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="13"/></svg>',
  '<svg viewBox="0 0 100 100"><path d="M50 6l12.9 27.6 30.1 3.7-22.2 20.7 5.8 29.8L50 73 23.4 87.8l5.8-29.8L7 37.3l30.1-3.7z"/></svg>'
];
const SVG_SKIP = '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><circle cx="50" cy="50" r="36"/><path d="M25 75 75 25"/></svg>';
const SVG_REV = '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M20 38h56L60 22"/><path d="M80 62H24l16 16"/></svg>';
const SVG_WILD = '<svg viewBox="0 0 100 100" stroke="none"><path d="M50 50V8a42 42 0 0 1 42 42z" fill="#FF5A5F"/><path d="M50 50h42a42 42 0 0 1-42 42z" fill="#F5A300"/><path d="M50 50v42A42 42 0 0 1 8 50z" fill="#16C79A"/><path d="M50 50H8A42 42 0 0 1 50 8z" fill="#7B61FF"/></svg>';
const SVG_SOUND_ON = '<svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM11 5.5a3.5 3.5 0 0 1 0 5"/></svg>';
const SVG_SOUND_OFF = '<svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM11 6l3 4M14 6l-3 4"/></svg>';
const AVA_H = ['🐱','🐶','🐰','🐯'];
const BOTS = [{name:'小狐',ava:'🦊'},{name:'胖達',ava:'🐼'},{name:'呱呱',ava:'🐸'}];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
const TURN_MS = 30000;      // 連線時每回合的思考時間
const CALL_MS = 2600;       // 出到剩一張後，可以補喊 UNO 的時間

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const cfg = {n:4, sound:true};
try{ const saved=JSON.parse(store.get('lastcard-cfg')||'null'); if(saved){ cfg.n=saved.n>=2&&saved.n<=4?saved.n:4; cfg.sound=saved.sound!==false; } }catch(e){}
function saveCfg(){ store.set('lastcard-cfg',JSON.stringify(cfg)); }

let mode='local';           // 'local' 單機 / 'online' 連線
let ME=0;                   // 我坐第幾個位子
let seats=[], scores=[];
let state=null, view=null, busy=true, acting=false, token=0;
let shownSeq=0, localSeq=0, resultSeq=-1;
let called=false, callPending=false, callResolve=null, colorResolve=null;
let driverTimer=0, clockTimer=0, clockEnd=0;
const queue=[]; let pumping=false; let waiters=[];

const who = pi => pi===ME ? '你' : seats[pi].name;

function label(card){
  if(card.v==='skip') return SVG_SKIP;
  if(card.v==='rev') return SVG_REV;
  if(card.v==='d2') return '+2';
  if(card.v==='w4') return '+4';
  if(card.v==='wild') return SVG_WILD;
  return (card.v==='6'||card.v==='9') ? '<span class="u">'+card.v+'</span>' : card.v;
}
function cardEl(card){
  const el=document.createElement('div');
  el.dataset.id=card.id;
  if(card.c<0){
    el.className='card wild';
    const cor = card.v==='w4' ? '+4' : SVG_WILD;
    el.innerHTML='<span class="cor">'+cor+'</span><span class="big">'+SVG_WILD+'</span>'+
      (card.v==='w4'?'<span class="plus">+4</span>':'')+'<span class="cor b">'+cor+'</span>';
  } else {
    el.className='card c'+card.c;
    const l=label(card), txt=(card.v==='d2')?' txt':'';
    el.innerHTML='<span class="bg">'+SHAPE[card.c]+'</span><span class="cor">'+l+'</span><span class="big'+txt+'">'+l+
      '</span><span class="cor b">'+l+'</span>';
  }
  return el;
}
function backEl(){ const el=document.createElement('div'); el.className='card back'; return el; }

// ---------- 音效 ----------
let ac=null;
function tone(f,t0,d,type,v,f2){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(v||.12,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d+.03);
}
function sfx(k){
  if(!cfg.sound) return;
  try{
    if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ac=new AC(); }
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    if(k==='play'){ tone(560,t,.07); tone(420,t+.04,.08); }
    else if(k==='draw') tone(300,t,.06,'sine');
    else if(k==='special'){ tone(392,t,.1,'square',.05); tone(587,t+.09,.14,'square',.05); }
    else if(k==='skip'){ tone(620,t,.28,'square',.05,190); }
    else if(k==='rev'){ tone(280,t,.3,'triangle',.12,880); tone(880,t+.3,.25,'triangle',.1,300); }
    else if(k==='d2'){ tone(196,t,.12,'square',.06); tone(262,t+.14,.16,'square',.06); }
    else if(k==='w4'){ [196,233,277,330].forEach((f,i)=>tone(f,t+i*.1,.14,'square',.06)); tone(90,t+.42,.4,'sine',.2,45); }
    else if(k==='wild'){ [523,659,784,988].forEach((f,i)=>tone(f,t+i*.07,.16,'triangle',.09)); }
    else if(k==='hit'){ tone(140,t,.2,'sine',.22,60); }
    else if(k==='stamp'){ tone(220,t,.12,'sawtooth',.05,110); }
    else if(k==='call'){ tone(880,t,.1); tone(1175,t+.1,.2); }
    else if(k==='throw'){ tone(320,t,.2,'sine',.08,900); }
    else if(k==='splat'){ tone(210,t,.16,'sawtooth',.09,55); tone(90,t,.22,'sine',.2,40); }
    else if(k==='bad') tone(160,t,.16,'sawtooth',.06);
    else if(k==='win') [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.11,.22));
    else if(k==='lose') [440,370,311].forEach((f,i)=>tone(f,t+i*.16,.26,'sine'));
  }catch(e){}
}

// ---------- 繪製 ----------
function syncView(){
  view={hands:state.players.map(p=>p.hand.slice()),pile:state.discard.slice(-3),color:state.color,
        dir:state.dir,turn:state.turn,deck:state.deck.length};
}
const myTurn = () => !busy && !acting && !callPending && state && state.turn===ME && state.phase!=='over';

// 座位：自己永遠在下方，其他人依順時針坐左、上、右
function seatPos(pi,n){
  const rel=((pi-ME)%n+n)%n;
  return (n===4?['bottom','left','top','right']:n===3?['bottom','left','right']:['bottom','top'])[rel];
}
function renderOpps(){
  const slots={top:$('#slotTop'),left:$('#slotL'),right:$('#slotR')};
  const total=view.hands.length, keep={};
  for(let pi=0;pi<total;pi++){
    if(pi===ME) continue;
    const n=view.hands[pi].length, pos=seatPos(pi,total);
    let s=$('#seat'+pi);
    if(!s || s.parentNode!==slots[pos]){          // 座位元素會留著重複使用，長按才不會被打斷
      if(s) s.remove();
      s=document.createElement('div'); s.id='seat'+pi; s.dataset.pi=pi;
      s.innerHTML='<div class="ava"></div><div class="meta"><div class="nm"></div><div class="cnt"></div></div><div class="mini"></div>';
      slots[pos].appendChild(s);
    }
    keep[s.id]=1;
    const off = mode==='online' && !seats[pi].bot && !Online.isOn(seats[pi].pid);
    s.className='seat'+(pos==='top'?'':' side')+(view.turn===pi?' active':'')+(off?' off':'')+(s.classList.contains('pressing')?' pressing':'');
    const rc=reactions[pi];
    s.querySelector('.ava').textContent = rc && rc.until>Date.now() ? rc.face : seats[pi].ava;
    s.querySelector('.nm').textContent=seats[pi].name;
    s.querySelector('.cnt').textContent=n+' 張'+(off?'・離線':'');
    const m=s.querySelector('.mini'), want=Math.min(n,pos==='top'?8:6);
    while(m.children.length>want) m.lastChild.remove();
    while(m.children.length<want) m.appendChild(backEl());
  }
  document.querySelectorAll('#slotTop .seat,#slotL .seat,#slotR .seat').forEach(el=>{ if(!keep[el.id]) el.remove(); });
}
function renderCenter(){
  const t=$('#table');
  t.style.setProperty('--cur',HEX[view.color]);
  t.classList.toggle('ccw',view.dir===-1);
  $('#deckCount').textContent=Math.max(0,view.deck);
  const pile=$('#pile'); pile.innerHTML='';
  const shown=view.pile.slice(-3);
  shown.forEach((c,i)=>{
    const el=cardEl(c);
    el.style.transform='rotate('+(((c.id*37)%17)-8)+'deg)';
    if(i===shown.length-1 && c.c<0) el.classList.add('pick'+view.color);
    pile.appendChild(el);
  });
  const mine=myTurn(), can=mine?Engine.playable(state,ME).length:0;
  $('#deck').classList.toggle('hintme',mine && state.phase==='play' && !can);
  let whoTxt='', hint='';
  if(state.phase!=='over'){
    if(view.turn===ME){
      whoTxt='輪到你了';
      if(mine) hint = state.phase==='drawn' ? '抽到能出的牌：點它出牌，或按「不出」'
                    : can ? '點一張亮起的牌出牌' : '沒有能出的牌，點牌堆抽一張';
    } else whoTxt=seats[view.turn].name+'的回合';
  }
  $('#whoTxt').textContent=whoTxt; $('#hint').textContent=hint;
}
const ORDER = {skip:10,rev:11,d2:12,wild:20,w4:21};
function sortKey(c){ return (c.c<0?4:c.c)*100 + (c.v in ORDER ? ORDER[c.v] : +c.v); }
function renderHand(){
  const box=$('#hand'); box.innerHTML='';
  const mine=myTurn();
  const cards=view.hands[ME].slice().sort((a,b)=>sortKey(a)-sortKey(b)||a.id-b.id);
  cards.forEach(c=>{
    const el=cardEl(c);
    if(mine){ el.classList.add(Engine.canPlay(state,c)?'can':'dim'); }
    el.addEventListener('click',()=>onCard(c,el));
    box.appendChild(el);
  });
  layoutHand();
}
function layoutHand(){
  const box=$('#hand'), els=[...box.children], n=els.length;
  if(!n) return;
  const W=box.clientWidth, w=els[0].offsetWidth, h=els[0].offsetHeight;
  const stepX = n>1 ? Math.min(w*0.8,(W-w)/(n-1)) : 0;
  const x0=(W-(w+stepX*(n-1)))/2, mid=(n-1)/2;
  els.forEach((el,i)=>{
    const d=i-mid, rot=d*Math.min(2.4,26/n);
    const y=(mid?Math.pow(d/mid,2):0)*h*0.035 - (el.classList.contains('can')?h*0.13:0);
    el.style.left=(x0+stepX*i)+'px'; el.style.zIndex=i+1;
    el.style.transform='translateY('+y+'px) rotate('+rot+'deg)';
  });
}
// UNO 按鈕一直都在；能按的時候才亮起來
function unoReady(){

function renderHud(){

function render(){ if(!view||!state) return; renderOpps(); renderCenter(); renderHand(); renderHud(); }

// ---------- 動畫小工具 ----------
function fly(el,from,to,dur){
  el.style.position='fixed'; el.style.left=to.left+'px'; el.style.top=to.top+'px';
  el.style.setProperty('--h',to.height+'px'); el.style.margin='0';
  $('#fx').appendChild(el);
  const sc=from.height/to.height;
  const dx=(from.left+from.width/2)-(to.left+to.width/2), dy=(from.top+from.height/2)-(to.top+to.height/2);
  if(!el.animate) { el.remove(); return Promise.resolve(); }
  const a=el.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')'},{transform:'none'}],
    {duration:REDUCED?1:(dur||260),easing:'cubic-bezier(.2,.8,.2,1)'});
  const done=()=>el.remove();
  return a.finished.then(done,done);
}
function cardRect(r,h){ const w=h*0.68; return {left:r.left+r.width/2-w/2,top:r.top+r.height/2-h/2,width:w,height:h}; }
function seatRect(pi){
  if(pi===ME){ const r=$('#hand').getBoundingClientRect(), h=$('#pile').offsetHeight;
    return cardRect({left:r.left,top:r.bottom-h,width:r.width,height:h},h); }
  const m=document.querySelector('#seat'+pi+' .mini'); if(!m) return pileRect();
  const r=m.getBoundingClientRect(); return cardRect(r,r.height);
}
const pileRect = () => $('#pile').getBoundingClientRect();
const deckRect = () => $('#deck').getBoundingClientRect();
function bubble(pi,text){
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  let x,y;
  if(pi===ME){ const r=$('#hand').getBoundingClientRect(); x=r.left+r.width/2; y=r.top-26; }
  else { const s=$('#seat'+pi); if(!s) return; const r=s.getBoundingClientRect();
    x=Math.max(56,Math.min(innerWidth-56,r.left+r.width/2)); y=s.classList.contains('side')?r.top+6:r.bottom+4; }
  b.style.left=x+'px'; b.style.top=y+'px';
  $('#fx').appendChild(b); setTimeout(()=>b.remove(),1500);
}
let toastTimer=0;
function toast(text,ms){
  const t=$('#toast'); t.textContent=text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),ms||1600);
}

// ---------- 特殊牌演出 ----------
function restart(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const centerOf = r => ({x:r.left+r.width/2,y:r.top+r.height/2});
function targetPoint(pi){
  if(pi===ME){ const r=$('#hand').getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*0.45}; }
  const s=$('#seat'+pi); return centerOf(s?s.getBoundingClientRect():pileRect());
}
function seatBox(pi){
  const pos=seatPos(pi,state.players.length);
  return $(pos==='bottom'?'#handWrap':pos==='top'?'#slotTop':pos==='left'?'#slotL':'#slotR');
}
function fxEl(cls,pt,html,color){

}
let bnSeq=0;
// 畫面中央的大字橫幅：說明剛剛發生什麼事
function banner(o){
  const b=$('#banner'), dur=REDUCED?700:(o.dur||950), seq=++bnSeq;
  b.style.setProperty('--by',centerOf($('#piles').getBoundingClientRect()).y+'px');
  b.style.setProperty('--bd',dur+'ms'); b.style.setProperty('--bc',o.color||'#1B2A33');

  return sleep(dur).then(()=>{ if(seq===bnSeq) b.classList.remove('go'); });
}
// 效果從棄牌堆飛向被影響的玩家
async function shoot(html,color,pi){
  const from=centerOf(pileRect()), to=targetPoint(pi), el=fxEl('shot',to,html,color);
  const dx=from.x-to.x, dy=from.y-to.y;
  if(el.animate && !REDUCED){
    const a=el.animate([{transform:'translate('+dx+'px,'+dy+'px) scale(.5)'},
      {transform:'translate('+dx*.5+'px,'+dy*.5+'px) scale(1.35)',offset:.45},{transform:'none'}],
      {duration:420,easing:'cubic-bezier(.5,0,.6,1)'});
    try{ await a.finished; }catch(e){}
  }
  el.remove();
  const b=fxEl('burst',to,'',color); setTimeout(()=>b.remove(),520);
  const box=seatBox(pi); restart(box,'hit'); setTimeout(()=>box.classList.remove('hit'),450);

}

async function stamp(pi){

}
function ripple(ci){
  const r=$('#ripple'), c=centerOf(pileRect());
  r.style.setProperty('--rc',HEX[ci]); r.style.setProperty('--rx',c.x+'px'); r.style.setProperty('--ry',c.y+'px');

function orbit(dir,color){
  const o=$('#orbit'), W=innerWidth, H=innerHeight, e=o.querySelector('ellipse');
  o.setAttribute('viewBox','0 0 '+W+' '+H);
  e.setAttribute('cx',W/2); e.setAttribute('cy',H/2); e.setAttribute('rx',W*0.43); e.setAttribute('ry',H*0.4);
  e.style.stroke=color; o.style.setProperty('--od',dir===1?-560:560);

}
function clearFx(){
  bnSeq++; $('#fx').innerHTML='';
  ['#banner','#ripple','#orbit'].forEach(q=>$(q).classList.remove('go'));

// ---------- 互動：長按對手頭像丟東西 ----------
const SVG_BLOB = 'M50 8c10 0 14 9 24 12s19 6 18 18-10 13-9 24 2 22-10 26-17-6-27-4-21 6-28-4-1-18-6-28S4 32 12 24s16-2 22-8S42 8 50 8z';
const EMO = {
  egg:{ico:'🥚',face:'😵',bits:['#FFFDF5','#FFFDF5','#FFC21A'],
    splat:'<svg viewBox="0 0 100 112"><rect x="27" y="70" width="9" height="30" rx="4.5" fill="#FFFDF5"/><rect x="60" y="74" width="8" height="22" rx="4" fill="#FFFDF5"/><path d="'+SVG_BLOB+'" fill="#FFFDF5"/><circle cx="52" cy="50" r="17" fill="#FFC21A"/><circle cx="46" cy="44" r="5" fill="#FFE27A"/></svg>'},

};
const SVG_STINK = '<svg viewBox="0 0 20 50" fill="none" stroke="#9BD14B" stroke-width="4" stroke-linecap="round"><path d="M10 48c-8-8 8-12 0-22s8-14 0-24"/></svg>';
const reactions={};
let emoCool=0, pressTimer=0, pressSeat=null, pressXY=null, emoTimer=0;
function cancelPress(){

  if(pressSeat){ pressSeat.classList.remove('pressing'); pressSeat=null; }

function openEmoMenu(pi){

}
function closeEmoMenu(){ clearTimeout(emoTimer); $('#emoMenu').hidden=true; }
function throwAt(to,kind){
  if(!state || to===ME || !seats[to]) return;
  if(Date.now()<emoCool) return;
  emoCool=Date.now()+1200;
  sendEmote(ME,to,kind);
  if(seats[to].bot && Math.random()<0.35){        // 電腦偶爾會丟回來
    const tok=token, me=ME;
    setTimeout(()=>{ if(tok===token && state) sendEmote(to,me,Math.random()<.5?'egg':'poo'); },1500);
  }
}
function sendEmote(from,to,kind){
  if(mode==='online') Online.emote(from,to,kind);
  playEmote(from,to,kind);
}
async function playEmote(from,to,kind){
  const E=EMO[kind];
  if(!E || !state || !view || $('#table').hidden) return;
  if(!(from>=0 && from<seats.length && to>=0 && to<seats.length) || from===to) return;
  const tok=token, a=targetPoint(from), b=targetPoint(to);
  const el=fxEl('proj',b,E.ico);
  sfx('throw');
  if(el.animate && !REDUCED){
    const dx=a.x-b.x, dy=a.y-b.y, lift=50+Math.abs(dx)*0.12, kf=[];
    for(let k=0;k<=6;k++){ const t=k/6;
      kf.push({transform:'translate('+dx*(1-t)+'px,'+(dy*(1-t)-lift*4*t*(1-t))+'px) rotate('+(540*t)+'deg) scale('+(0.7+0.5*Math.sin(Math.PI*t)+0.3*t)+')'}); }
    try{ await el.animate(kf,{duration:560,easing:'linear'}).finished; }catch(e){}
  }
  el.remove();
  if(tok!==token || !state) return;
  sfx('splat');
  const sp=fxEl('splat',b,E.splat); setTimeout(()=>sp.remove(),2400);
  for(let i=0;i<10;i++){
    const bit=fxEl('bit',b,''); const ang=Math.random()*Math.PI*2, dist=34+Math.random()*60, size=5+Math.random()*7;
    bit.style.width=bit.style.height=size+'px'; bit.style.background=E.bits[i%E.bits.length];
    const bx=Math.cos(ang)*dist, by=Math.sin(ang)*dist;
    if(bit.animate && !REDUCED){
      bit.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+bx*.7+'px,'+(by*.7-14)+'px) scale(1)',opacity:1,offset:.5},
        {transform:'translate('+bx+'px,'+(by+34)+'px) scale(.5)',opacity:0}],{duration:520+Math.random()*260,easing:'ease-out'}).finished.then(()=>bit.remove(),()=>bit.remove());
    } else bit.remove();
  }
  if(kind==='poo' && !REDUCED){
    for(let i=0;i<3;i++){
      const st=fxEl('stink',{x:b.x+(i-1)*22,y:b.y-26},SVG_STINK);
      if(st.animate) st.animate([{transform:'translateY(10px)',opacity:0},{opacity:.95,offset:.25},{transform:'translateY(-46px)',opacity:0}],
        {duration:1500,delay:250+i*220,fill:'both',easing:'ease-out'}).finished.then(()=>st.remove(),()=>st.remove());
      else st.remove();
    }
  }
  const box=seatBox(to); restart(box,'hit'); setTimeout(()=>box.classList.remove('hit'),450);
  if(to!==ME){                                   // 被打中的人換個表情
    reactions[to]={face:E.face,until:Date.now()+3600};
    const av=document.querySelector('#seat'+to+' .ava'); if(av) av.textContent=E.face;
    setTimeout(()=>{ if(tok===token && state && view) renderOpps(); },3650);
  }
}
function bindEmotes(){
  ['#slotTop','#slotL','#slotR'].forEach(q=>{
    const box=$(q);
    box.addEventListener('pointerdown',e=>{
      const s=e.target.closest('.seat');
      if(!s || (e.pointerType==='mouse' && e.button!==0)) return;

      pressTimer=setTimeout(()=>{ const pi=+s.dataset.pi; cancelPress(); openEmoMenu(pi); },420);
    });

  });
  window.addEventListener('pointerup',cancelPress);
  window.addEventListener('pointercancel',cancelPress);
  window.addEventListener('pointermove',e=>{ if(pressXY && Math.hypot(e.clientX-pressXY[0],e.clientY-pressXY[1])>14) cancelPress(); });
  document.addEventListener('pointerdown',e=>{ if(!$('#emoMenu').hidden && !e.target.closest('#emoMenu')) closeEmoMenu(); },true);
  $('#emoMenu').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;

function emoTip(){

// ---------- 把引擎事件一個個演出來 ----------
async function showEvent(e,tok,evs,i){
  if(e.t==='play'){
    let from;
    if(e.pi===ME){ const src=document.querySelector('#hand .card[data-id="'+e.card.id+'"]'); from=src?src.getBoundingClientRect():seatRect(ME); }
    else from=seatRect(e.pi);
    view.hands[e.pi]=view.hands[e.pi].filter(c=>c.id!==e.card.id);
    render();
    await fly(cardEl(e.card),from,pileRect(),280);
    if(tok!==token) return;
    view.pile.push(e.card); view.color=e.color; render();
    const v=e.card.v, col=HEX[e.color];
    if(v.length===1 || evs.some(x=>x.t==='win')){ sfx('play'); return; }
    const sk=evs.slice(i+1).find(x=>x.t==='skip'), tg=sk?sk.pi:-1;
    if(v==='skip'){
      sfx('skip');
      await banner({ico:SVG_SKIP,big:'跳過！',sub:who(tg)+'這回合不能出牌',color:col});
    } else if(v==='d2'){
      sfx('d2');
      await banner({big:'+2',num:1,sub:who(tg)+'抽 2 張，這回合不能出牌',color:col});
      if(tok!==token) return;
      await shoot('+2',col,tg);
    } else if(v==='w4'){
      sfx('w4'); ripple(e.color);
      await banner({ico:SVG_WILD,spin:1,big:'+4',num:1,sub:who(tg)+'抽 4 張，顏色換成'+CNAME[e.color],color:col,wild:1,dur:1000});
      if(tok!==token) return;
      await shoot('+4',col,tg); quake();
    } else if(v==='wild'){
      sfx('wild'); ripple(e.color);
      await banner({ico:SVG_WILD,spin:1,big:'變色！',sub:'顏色換成'+CNAME[e.color],color:col,wild:1,dur:900});
    } else sfx('special');   // 迴轉的演出在下面的 rev 事件
  } else if(e.t==='draw'){
    let tl=null, k=0;
    if(e.penalty){
      const pt=targetPoint(e.pi);
      tl=document.createElement('div'); tl.className='tally'; tl.style.left=pt.x+'px'; tl.style.top=pt.y+'px'; tl.hidden=true;
      $('#fx').appendChild(tl);
    }
    for(const c of e.cards){
      sfx('draw');
      await fly(backEl(),deckRect(),seatRect(e.pi),e.penalty?170:200);
      if(tok!==token) return;
      view.hands[e.pi].push(c); view.deck--; render();
      if(tl){ tl.hidden=false; tl.textContent='+'+(++k); restart(tl,'pop'); }
    }
    if(tl){ await sleep(REDUCED?150:380); tl.remove(); }
  } else if(e.t==='rev'){
    view.dir=e.dir; render();
    const nx=evs[i+1], two=state.players.length===2 && nx && nx.t==='skip';
    sfx('rev'); orbit(e.dir,HEX[view.color]);
    await banner({ico:SVG_REV,spin:e.dir,big:'迴轉！',color:HEX[view.color],
      sub: two ? who(nx.pi)+'這回合不能出牌' : '出牌順序改成'+(e.dir===1?'順時針':'逆時針')});
  } else if(e.t==='skip'){ await stamp(e.pi);
  } else if(e.t==='uno'){ bubble(e.pi,'UNO！'); sfx('call');
  } else if(e.t==='forgot'){ sfx('bad'); toast(who(e.pi)+'忘了喊 UNO，罰抽 2 張',2200);
  } else if(e.t==='turn'){ view.turn=e.pi; render();
  } else if(e.t==='reshuffle'){ toast('牌堆用完了，重新洗牌'); view.pile=view.pile.slice(-1); view.deck=e.deck; render(); await sleep(350); }
}
async function runEvents(evs,tok){
  for(let i=0;i<evs.length;i++){ if(tok!==token) return; await showEvent(evs[i],tok,evs,i); }
}

// ---------- 動作送出與播放 ----------
// 所有動作都走 commit：單機直接改本機狀態，連線則寫進房間，所有人收到後各自播放
function finish(st,sc,ev){
  if(st.phase==='over'){
    const gain=st.players.reduce((a,p)=>a+p.hand.reduce((x,c)=>x+Engine.points(c),0),0);
    sc[st.winner]=(sc[st.winner]||0)+gain;
  }
  return ev;
}
function commit(fn,strict){
  if(mode==='online') return Online.commit(fn,strict);
  const ev=fn(state,scores);
  if(!ev) return Promise.resolve(0);
  const seq=++localSeq; queue.push({seq,ev}); pump();
  return Promise.resolve(seq);
}
function shown(seq){
  if(shownSeq>=seq) return Promise.resolve(true);
  return new Promise(res=>waiters.push({seq,res}));
}
function flushWaiters(all){
  waiters=waiters.filter(w=>{ if(all){ w.res(false); return false; } if(shownSeq>=w.seq){ w.res(true); return false; } return true; });
}
async function pump(){
  if(pumping) return;
  pumping=true; const tok=token;
  while(queue.length && tok===token){
    const it=queue.shift();
    if(it.g){                                   // 連線：收到房間的新狀態
      const g=it.g, me=g.seats.findIndex(s=>s.pid===Online.pid);
      if(me<0){ leaveToMenu('這一局你不在座位上'); return; }
      const cont = state && it.seq===shownSeq+1 && g.ev && g.ev.length && g.ev[0].t!=='deal';
      if(cont){ busy=true; render(); await runEvents(g.ev,tok); if(tok!==token) return; }
      else { clearFx(); $('#resultModal').hidden=true; resultSeq=-1; }
      seats=g.seats; ME=me; scores=g.scores; state=g.state; state.rng=Math.random;
    } else {                                    // 單機
      busy=true; render();
      await runEvents(it.ev,tok); if(tok!==token) return;
    }
    shownSeq=it.seq; syncView(); render(); flushWaiters();
  }
  if(tok!==token) return;
  pumping=false;
  settle();
}
// 動畫播完後：決定現在輪到誰、要不要結算、要不要幫電腦出牌
function settle(){
  if(!state || pumping) return;
  clearTimeout(driverTimer); stopClock();
  if(state.phase==='over'){ busy=true; render(); if(resultSeq!==shownSeq){ resultSeq=shownSeq; showResult(); } return; }
  busy=false; render();
  if(mode==='online' && state.turn===ME && !acting && !callPending) startClock();
  scheduleDriver();
}
function scheduleDriver(){
  clearTimeout(driverTimer);
  if(!state || state.phase==='over' || pumping) return;
  const pi=state.turn, seat=seats[pi];
  let delay;
  const quick = state.phase==='drawn' ? 520 : 780+Math.random()*640;
  if(mode==='local'){ if(pi===ME) return; delay=quick; }
  else {
    if(!Online.amDriver()) return;
    delay = (seat.bot || !Online.isOn(seat.pid)) ? quick : TURN_MS+3000;   // 真人太久沒出牌，電腦代出
  }
  const seq=shownSeq, tok=token;
  driverTimer=setTimeout(()=>{
    if(tok!==token || seq!==shownSeq || pumping) return;
    if(pi===ME && (acting||callPending)) return;
    botAct(pi);
  },delay);
}
function botAct(pi){
  commit((st,sc)=>{
    if(st.turn!==pi || st.phase==='over') return null;
    const mv=Bot.choose(st,pi); let ev;
    if(mv.type==='draw') ev=Engine.draw(st,pi);
    else if(mv.type==='pass') ev=Engine.pass(st,pi);
    else {
      ev=Engine.play(st,pi,mv.id,mv.color);
      if(st.phase!=='over' && st.players[pi].hand.length===1) ev.splice(1,0,{t:'uno',pi});
    }
    return finish(st,sc,ev);
  },true);
}
function startClock(){
  stopClock(); clockEnd=Date.now()+TURN_MS;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((clockEnd-Date.now())/1000)), c=$('#clock');
    c.hidden=false; c.textContent=left; c.classList.toggle('low',left<=10);
  };
  tick(); clockTimer=setInterval(tick,500);
}
function stopClock(){ clearInterval(clockTimer); clockTimer=0; $('#clock').hidden=true; }

// ---------- 我的操作 ----------
function pickColor(){
  return new Promise(res=>{ colorResolve=res; $('#colorModal').hidden=false; });
}
function waitCall(ms){
  return new Promise(res=>{
    callPending=true; $('#unoBtn').style.setProperty('--win',ms+'ms'); if(state) renderHud();
    const timer=setTimeout(()=>finishCall(false),ms);
    function finishCall(ok){ clearTimeout(timer); callPending=false; callResolve=null; if(state) renderHud(); res(ok); }
    callResolve=()=>finishCall(true);
  });
}
async function onCard(card,el){
  if(!myTurn()) return;
  const tok=token, me=ME;
  if(!Engine.canPlay(state,card)){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); sfx('bad'); return;
  }
  acting=true; stopClock();
  let color;
  if(card.c===-1){
    if(state.players[me].hand.length===1) color=0;
    else { color=await pickColor(); if(tok!==token) return; if(color==null){ acting=false; settle(); return; } }
  }
  const toOne = state.players[me].hand.length===2, pre=called;
  called=false;
  const seq=await commit((st,sc)=>{
    if(st.turn!==me) return null;
    let ev; try{ ev=Engine.play(st,me,card.id,color); }catch(err){ return null; }
    if(pre && st.phase!=='over' && st.players[me].hand.length===1) ev.splice(1,0,{t:'uno',pi:me});
    return finish(st,sc,ev);
  },true);
  if(tok!==token) return;
  if(seq && toOne && !pre){
    await shown(seq); if(tok!==token) return;
    if(state.phase!=='over' && state.players[me].hand.length===1){
      const ok=await waitCall(CALL_MS);
      if(tok!==token) return;
      if(ok) await commit(st=>[{t:'uno',pi:me}]);
      else await commit(st=>{
        if(st.phase==='over' || st.players[me].hand.length!==1) return null;
        return [{t:'forgot',pi:me}].concat(Engine.penalty(st,me,2));
      });
      if(tok!==token) return;
    }
  }
  acting=false; settle();
}
async function onDeck(){
  if(!myTurn() || state.phase!=='play') return;
  const tok=token, me=ME; acting=true; called=false; stopClock();
  await commit(st=>{ if(st.turn!==me || st.phase!=='play') return null; return Engine.draw(st,me); },true);
  if(tok!==token) return;
  acting=false; settle();
}
async function onPass(){
  if(!myTurn() || state.phase!=='drawn') return;
  const tok=token, me=ME; acting=true; called=false; stopClock();
  await commit(st=>{ if(st.turn!==me || st.phase!=='drawn') return null; return Engine.pass(st,me); },true);
  if(tok!==token) return;
  acting=false; settle();
}
function onUno(){
  if(callResolve){ callResolve(); return; }           // 出完牌後補喊
  if(unoReady()){ called=true; bubble(ME,'UNO！'); sfx('call'); renderHud(); toast('已經喊 UNO，出牌吧',1200); return; }
  sfx('bad');
  if(state && state.phase!=='over') toast('手上剩兩張、準備出牌時才能喊 UNO',1500);
}

// ---------- 結算 ----------
function showResult(){
  const w=state.winner, n=state.players.length;
  const pts=state.players.map(p=>p.hand.reduce((a,c)=>a+Engine.points(c),0));
  const gain=pts.reduce((a,b)=>a+b,0);
  sfx(w===ME?'win':'lose');
  $('#resTitle').textContent = w===ME ? '你贏了這一局！' : seats[w].name+'贏了這一局';
  const body=$('#resBody');
  body.innerHTML='<span></span><span class="hd">玩家</span><span class="hd">剩下的牌</span><span class="hd num">本局</span><span class="hd num">累計</span>';
  for(let pi=0;pi<n;pi++){
    const cls=pi===w?' win':'';
    const add=(html,c)=>{ const s=document.createElement('span'); s.className=c; s.innerHTML=html; body.appendChild(s); return s; };
    add(seats[pi].ava,'');
    add(esc(seats[pi].name)+(mode==='online'&&pi===ME?'（你）':''),'name'+cls);
    const left=add('','left');
    state.players[pi].hand.slice().sort((a,b)=>sortKey(a)-sortKey(b)).forEach(c=>left.appendChild(cardEl(c)));
    if(pi===w) left.textContent='出完了';
    add(pi===w?'+'+gain:'0','num'+cls);
    add(String(scores[pi]||0),'num'+cls);
  }
  renderResultBtns();
  $('#resultModal').hidden=false;
}
function renderResultBtns(){
  const a=$('#againBtn');
  if(mode==='online'){
    const drv=Online.amDriver();
    a.disabled=!drv; a.textContent=drv?'再來一局':'等房主開下一局';
    $('#menuBtn').textContent='離開房間';
  } else { a.disabled=false; a.textContent='再來一局'; $('#menuBtn').textContent='回主選單'; }
}

function showScreen(id){ ['menu','online','lobby','table'].forEach(s=>{ $('#'+s).hidden = s!==id; }); }
function resetRun(){
  token++; queue.length=0; pumping=false; flushWaiters(true);
  clearTimeout(driverTimer); stopClock();
  acting=false; callPending=false; callResolve=null; called=false; colorResolve=null;
  shownSeq=0; localSeq=0; resultSeq=-1;

// ---------- 連線 ----------
const DB_URL = 'https://lunar-village-default-rtdb.asia-southeast1.firebasedatabase.app';
const DB_ROOT = 'lastcard/rooms';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res;
    s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); });
}
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms||12000))]);
}
class UserErr extends Error{}
const Online = {
  db:null, code:'', pid:'', name:'', players:{}, meta:{}, total:4, refs:[], qSeq:-1, qJson:'', lastEmote:'',
  async boot(){
    if(this.db) return;
    if(!window.firebase){ await loadScript(SDK+'firebase-app-compat.js'); await loadScript(SDK+'firebase-database-compat.js'); }
    if(!firebase.apps.length) firebase.initializeApp({databaseURL:DB_URL});
    this.db=firebase.database();
    let pid=store.get('lastcard-pid');
    if(!pid){ pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3); store.set('lastcard-pid',pid); }
    this.pid=pid;
  },
  ref(p){ return this.db.ref(DB_ROOT+'/'+this.code+(p?'/'+p:'')); },
  TS(){ return firebase.database.ServerValue.TIMESTAMP; },
  sorted(){
    return Object.keys(this.players).map(pid=>Object.assign({pid},this.players[pid]))
      .filter(p=>p.name).sort((a,b)=>(a.joined||0)-(b.joined||0)||(a.pid<b.pid?-1:1));
  },
  isOn(pid){ return pid===this.pid || !!(this.players[pid] && this.players[pid].online); },
  isHost(){ const on=this.sorted().filter(p=>this.isOn(p.pid)); return !!on.length && on[0].pid===this.pid; },
  // 幫電腦和離線玩家出牌的人：座位最前面、目前在線的真人
  amDriver(){
    for(let i=0;i<seats.length;i++){ const s=seats[i]; if(s.bot) continue; if(this.isOn(s.pid)) return i===ME; }
    return false;
  },
  async create(){
    await this.boot();
    for(let i=0;i<10;i++){
      this.code=String(1000+Math.floor(Math.random()*9000));
      const m=(await withTimeout(this.ref('meta').once('value'))).val();
      if(!m || Date.now()-(m.created||0)>6*3600e3){
        await withTimeout(this.ref('').set({meta:{status:'lobby',created:this.TS()}}));
        return this.attach();
      }
    }
    this.code=''; throw new UserErr('現在開不了新房間，請再試一次');
  },
  async join(code){
    await this.boot(); this.code=code;
    const room=(await withTimeout(this.ref('').once('value'))).val();
    if(!room || !room.meta){ this.code=''; throw new UserErr('找不到房號 '+code+' 的房間'); }
    const players=room.players||{};
    if(room.meta.status==='playing'){
      let ok=false; try{ ok=JSON.parse(room.game.json).seats.some(s=>s.pid===this.pid); }catch(e){}
      if(!ok){ this.code=''; throw new UserErr('這個房間的遊戲已經開始了'); }
    } else if(!players[this.pid] && Object.keys(players).filter(k=>players[k].online).length>=4){
      this.code=''; throw new UserErr('這個房間已經滿了');
    }
    return this.attach();
  },
  async attach(){
    const me=this.ref('players/'+this.pid);
    const cur=(await withTimeout(me.once('value'))).val();
    await withTimeout(me.update({name:this.name,online:true,joined:(cur&&cur.joined)||this.TS()}));
    const conn=this.db.ref('.info/connected');
    conn.on('value',sn=>{ if(sn.val() && this.code){ me.onDisconnect().update({online:false}); me.update({online:true}); } });
    const pr=this.ref('players'), mr=this.ref('meta'), gr=this.ref('game'), er=this.ref('emote');
    this.refs=[conn,pr,mr,gr,er]; this.qSeq=-1; this.qJson='';
    try{ history.replaceState(null,'','?room='+this.code); }catch(e){}
    showScreen('lobby'); renderLobby();
    pr.on('value',sn=>{ this.players=sn.val()||{}; onPlayers(); });
    mr.on('value',sn=>{ this.meta=sn.val()||{}; });
    gr.on('value',sn=>{ const v=sn.val(); if(v && v.json) onGame(v); });
    let first=true;                                  // 進房時留在房間裡的舊互動不重播
    er.on('value',sn=>{
      const v=sn.val(), old=first; first=false;
      if(!v || v.id===this.lastEmote) return;
      this.lastEmote=v.id;
      if(!old && mode==='online') playEmote(v.from,v.to,v.kind);
    });
  },
  leave(){
    if(!this.code) return;
    try{
      this.refs.forEach(r=>r.off());
      const me=this.ref('players/'+this.pid);
      me.onDisconnect().cancel();
      if(this.meta.status==='playing') me.update({online:false}); else me.remove();
    }catch(e){}
    this.refs=[]; this.code=''; this.players={}; this.meta={}; this.qSeq=-1;
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  },
  async start(){
    const humans=this.sorted().filter(p=>this.isOn(p.pid)).slice(0,4);
    const total=Math.max(2,Math.min(4,Math.max(this.total,humans.length)));
    const sts=humans.map((p,i)=>({pid:p.pid,name:p.name,ava:AVA_H[i]}));
    for(let b=0;sts.length<total;b++) sts.push({bot:true,name:BOTS[b].name,ava:BOTS[b].ava});
    const prev=(await withTimeout(this.ref('game/seq').once('value'))).val()||0;
    await withTimeout(this.ref('game').set({seq:prev+1,
      json:JSON.stringify({state:Engine.newGame(total),ev:[{t:'deal'}],scores:sts.map(()=>0),seats:sts})}));
    await this.ref('meta/status').set('playing');
  },
  again(){
    this.ref('game').transaction(cur=>{
      if(!cur || !cur.json) return;
      const g=JSON.parse(cur.json);
      if(g.state.phase!=='over') return;
      g.state=Engine.newGame(g.seats.length); g.ev=[{t:'deal'}];
      return {seq:cur.seq+1,json:JSON.stringify(g)};
    },undefined,false);
  },
  emote(from,to,kind){
    const id=Math.random().toString(36).slice(2,10); this.lastEmote=id;
    try{ this.ref('emote').set({id,from,to,kind}); }catch(e){}
  },
  // 把一個動作寫進房間。strict：只有在我看到的就是最新狀態時才送出
  commit(fn,strict){
    const expect=shownSeq;
    return this.ref('game').transaction(cur=>{
      if(!cur || !cur.json) return;
      if(strict && cur.seq!==expect) return;
      const g=JSON.parse(cur.json); g.state.rng=Math.random;
      const ev=fn(g.state,g.scores);
      if(!ev) return;
      g.ev=ev;
      return {seq:cur.seq+1,json:JSON.stringify(g)};
    },undefined,false).then(r=>r.committed?r.snapshot.val().seq:0,()=>0);
  }
};
function onGame(v){
  if(v.seq<Online.qSeq) return;
  if(v.seq===Online.qSeq && v.json===Online.qJson) return;
  Online.qSeq=v.seq; Online.qJson=v.json;
  let g; try{ g=JSON.parse(v.json); }catch(e){ return; }
  if(mode!=='online' || $('#table').hidden){
    resetRun(); mode='online'; state=null; view=null; busy=true; shownSeq=-99;
    showScreen('table'); emoTip();
  }
  queue.push({seq:v.seq,g}); pump();
}
function onPlayers(){
  if(!$('#lobby').hidden) renderLobby();
  else if(mode==='online' && state && view && !pumping){
    renderOpps();
    if(!$('#resultModal').hidden) renderResultBtns();
    if(state.phase!=='over') scheduleDriver();
  }
}

function explain(e){

  if(s.includes('script')) return '載入連線功能失敗，請確認網路後再試一次';
  if(s.includes('timeout')) return '連線逾時，請確認網路後再試一次';
  return '連線失敗，請再試一次';
}

function init(){
  // 主選單右側的牌扇
  const fan=$('#heroFan');
  [{id:900,c:0,v:'7'},{id:901,c:1,v:'skip'},{id:902,c:-1,v:'wild'},{id:903,c:2,v:'d2'},{id:904,c:3,v:'rev'}]
    .forEach((c,i)=>{ const el=cardEl(c); el.style.transform='translateX('+((i-2)*24)+'%) rotate('+((i-2)*13)+'deg)'; fan.appendChild(el); });
  // 選色按鈕
  const cb=$('#colorBtns');
  HEX.forEach((hex,i)=>{
    const b=document.createElement('button'); b.style.background=hex; b.innerHTML=SHAPE[i];
    b.setAttribute('aria-label',CNAME[i]);
    b.addEventListener('click',()=>{ $('#colorModal').hidden=true; const r=colorResolve; colorResolve=null; if(r) r(i); });
    cb.appendChild(b);
  });
  $('#colorCancel').addEventListener('click',()=>{ $('#colorModal').hidden=true; const r=colorResolve; colorResolve=null; if(r) r(null); });
  $('#who').innerHTML='<span id="whoTxt"></span><span id="clock" hidden></span>';
  $('#nPrev').addEventListener('click',()=>setN(cfg.n-1));
  $('#nNext').addEventListener('click',()=>setN(cfg.n+1));
  $('#startBtn').addEventListener('click',()=>{ sfx('play'); startLocal(false); });
  $('#onlineBtn').addEventListener('click',()=>{ sfx('play'); openOnline(''); });
  $('#olBack').addEventListener('click',()=>showScreen('menu'));
  $('#createBtn').addEventListener('click',()=>goOnline('create'));
  $('#joinBtn').addEventListener('click',()=>goOnline('join'));
  $('#codeIn').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,4); });
  $('#lbLeave').addEventListener('click',()=>{ Online.leave(); showScreen('menu'); });
  $('#inviteBtn').addEventListener('click',invite);
  $('#tPrev').addEventListener('click',()=>{ Online.total--; renderLobby(); });
  $('#tNext').addEventListener('click',()=>{ Online.total++; renderLobby(); });
  $('#lbStart').addEventListener('click',async()=>{
    if(olBusy) return; olBusy=true; sfx('play');
    try{ await Online.start(); }catch(e){ toast(explain(e),2600); }
    olBusy=false;
  });
  bindEmotes();
  $('#deck').addEventListener('click',onDeck);
  $('#passBtn').addEventListener('click',onPass);
  $('#unoBtn').addEventListener('click',onUno);
  $('#soundBtn').addEventListener('click',()=>setSound(!cfg.sound));
  $('#pauseBtn').addEventListener('click',()=>{
    const ol=mode==='online';
    $('#pauseTitle').textContent=ol?'房號 '+Online.code:'暫停';
    $('#redealBtn').hidden=ol; $('#quitBtn').textContent=ol?'離開房間':'回主選單';
    $('#pauseModal').hidden=false;
  });
  $('#resumeBtn').addEventListener('click',()=>{ $('#pauseModal').hidden=true; });
  $('#redealBtn').addEventListener('click',()=>startLocal(true));
  $('#quitBtn').addEventListener('click',()=>{ if(mode==='online') leaveToMenu(); else toMenu(); });
  $('#againBtn').addEventListener('click',()=>{ if(mode==='online'){ if(Online.amDriver()) Online.again(); } else startLocal(true); });
  $('#menuBtn').addEventListener('click',()=>{ if(mode==='online') leaveToMenu(); else toMenu(); });
  window.addEventListener('resize',()=>{ if(view && state) layoutHand(); });
  document.addEventListener('gesturestart',e=>e.preventDefault());
  $('#nVal').textContent=cfg.n+' 人';
  setSound(cfg.sound);
  // 從邀請連結進來：直接帶到加入房間
  let room=''; try{ room=new URLSearchParams(location.search).get('room')||''; }catch(e){}
  if(/^\d{4}$/.test(room)){
    openOnline(room);
    if(store.get('lastcard-name')) goOnline('join'); else olMsg('輸入名字後按「加入」，就能進房號 '+room+' 的房間');
  }
}
if(typeof document!=='undefined') init();
</script>
</body>
</html>
